<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%">
  <defs>
    <linearGradient id="wordmarkChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E8EDF4"/>
      <stop offset="60%" stop-color="#9CA7B6"/>
      <stop offset="85%" stop-color="#E8EDF4"/>
      <stop offset="100%" stop-color="#6A778B"/>
    </linearGradient>
    <filter id="wmGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <text x="160" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="52" font-weight="900" letter-spacing="6" fill="url(#wordmarkChrome)" filter="url(#wmGlow)">NOVA</text>
  <circle cx="214" cy="40" r="2.5" fill="#5AA9FF" filter="url(#wmGlow)"/>
</svg>
