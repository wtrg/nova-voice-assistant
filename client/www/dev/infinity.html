<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nova Infinity Soul — Prototype & Benchmark</title>
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/glass.css">
  <link rel="stylesheet" href="../css/cyber.css">
  <style>
    body {
      background: var(--nova-black);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #viewport3d {
      width: 100%;
      height: 60vh;
      position: relative;
    }
    .hud-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      color: var(--nova-silver-200);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 10px 14px;
      background: rgba(10, 16, 26, 0.8);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
    }
    .controls-bar {
      display: flex;
      gap: 8px;
      margin-top: 16px;
      z-index: 10;
    }
    .ctrl-btn {
      padding: 8px 16px;
      border-radius: var(--radius-full);
      background: rgba(18, 28, 44, 0.8);
      border: 1px solid var(--border);
      color: var(--nova-silver-200);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .ctrl-btn:active {
      background: var(--nova-blue);
      color: #fff;
    }
  </style>
  <script src="../assets/3d/three.min.js"></script>
  <script src="../js/three/PerformanceGovernor.js"></script>
  <script src="../js/three/InfinitySoul.js"></script>
  <script src="../js/three/SoulCore.js"></script>
  <script src="../js/three/HudRings.js"></script>
  <script src="../js/three/EnergyParticles.js"></script>
  <script src="../js/three/NovaScene.js"></script>
</head>
<body>
  <div class="hud-overlay" id="benchmarkInfo">
    <div>NOVA INFINITY SOUL BENCHMARK</div>
    <div>FPS: <span id="fpsVal">60</span></div>
    <div>Tier: <span id="tierVal">MEDIUM</span></div>
    <div>State: <span id="stateVal">idle</span></div>
  </div>

  <div id="viewport3d"></div>

  <div class="controls-bar">
    <button class="ctrl-btn" onclick="setSceneState('idle')">Idle</button>
    <button class="ctrl-btn" onclick="setSceneState('listening')">Listening</button>
    <button class="ctrl-btn" onclick="setSceneState('thinking')">Thinking</button>
    <button class="ctrl-btn" onclick="setSceneState('speaking')">Speaking</button>
    <button class="ctrl-btn" onclick="setSceneState('error')">Error</button>
  </div>

  <script>
    const container = document.getElementById("viewport3d");
    const scene = new NovaScene(container);
    window.novaScene = scene;

    function setSceneState(st) {
      scene.setState(st);
      document.getElementById("stateVal").textContent = st;
    }

    setInterval(() => {
      if (scene && scene.governor) {
        document.getElementById("fpsVal").textContent = scene.governor.fps;
        document.getElementById("tierVal").textContent = scene.governor.tier;
      }
    }, 500);
  </script>
</body>
</html>
