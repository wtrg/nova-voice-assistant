name: Client State Machine & Parity Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install client dependencies
      working-directory: client
      run: npm ci

    - name: Run Client State Machine & Parity Test Suite
      working-directory: client
      run: |
        npm test
