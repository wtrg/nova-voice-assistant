name: Production Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build Signed Release APK & AAB
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system audio libraries
        run: |
          sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Install server dependencies and run backend tests
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt -r server/requirements-dev.txt
          python -m pytest server/tests -v

      - name: Install client dependencies and run client tests
        working-directory: client
        run: |
          npm ci
          npm test

      - name: Sync Capacitor Android
        working-directory: client
        run: |
          npx cap sync android

      - name: Make Gradle wrapper executable
        working-directory: client/android
        run: chmod +x gradlew

      - name: Run Android Unit Tests
        working-directory: client/android
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run Android Lint
        working-directory: client/android
        run: ./gradlew lintDebug --no-daemon

      - name: Build Android Release (APK & AAB)
        working-directory: client/android
        run: |
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Prepare Signing and Artifacts
        id: sign
        working-directory: client/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-output
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          UNSIGNED_AAB=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Signing with production keystore..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            
            # Align and sign APK
            $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 "$UNSIGNED_APK" release-output/Nova_Assistant_aligned.apk
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks release.keystore \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out release-output/Nova_Assistant.apk \
              release-output/Nova_Assistant_aligned.apk
            rm -f release-output/Nova_Assistant_aligned.apk
            
            # Sign AAB using jarsigner
            jarsigner -keystore release.keystore \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              "$UNSIGNED_AAB" "$KEY_ALIAS"
            cp "$UNSIGNED_AAB" release-output/Nova_Assistant.aab
            rm -f release.keystore
          else
            echo "No production keystore secrets found; copying unsigned/release binaries..."
            cp "$UNSIGNED_APK" release-output/Nova_Assistant.apk
            cp "$UNSIGNED_AAB" release-output/Nova_Assistant.aab
          fi

          cd release-output
          sha256sum Nova_Assistant.apk > SHA256SUMS.txt
          sha256sum Nova_Assistant.aab >> SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            client/android/release-output/Nova_Assistant.apk
            client/android/release-output/Nova_Assistant.aab
            client/android/release-output/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
