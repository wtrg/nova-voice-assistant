services:
  - type: web
    name: nova-voice-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health/ready
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: SAYDI_API_KEY
        sync: false
      - key: SAYDI_VOICE
        value: "Saydi - Cuppy — Trợ lý ảo nữ"
      - key: CUPPY_REFERENCE_WAV
        value: "/app/server/data/voices/cuppy_sample.wav"
      - key: CUPPY_REFERENCE_DENOISE
        value: "true"
      - key: NOVA_API_BASE_URL
        fromService:
          type: web
          name: nova-voice-assistant
          property: host
