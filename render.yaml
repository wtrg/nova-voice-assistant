services:
  - type: web
    name: nova-voice-assistant
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /health/ready
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TIMEZONE
        value: Asia/Ho_Chi_Minh
      - key: NOVA_VOICE
        value: "Xuân Tiên"
      - key: VIENEU_MODE
        value: "v3nano"
      - key: TTS_PROVIDER
        value: "vieneu"
      - key: NOVA_API_BASE_URL
        fromService:
          type: web
          name: nova-voice-assistant
          property: host
